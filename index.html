<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSVP</title>
  <meta name="robots" content="noindex,nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500&family=Caveat:wght@500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f3ec;
      --card: #fffdf9;
      --ink: #2b2620;
      --muted: #8a8070;
      --line: #e6ddcc;
      --gold: #a58a5c;
      --bretagne: #29528a;
      --tunis: #b4551d;
    }
    body { font-family: 'Jost', ui-sans-serif, sans-serif; background: var(--paper); color: var(--ink); font-weight: 300; }
    .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
    .overline-sm { letter-spacing: .35em; text-transform: uppercase; font-size: .68rem; color: var(--gold); font-weight: 500; }
    .hero-names { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 600; line-height: 1.05; }
    .ornament { color: var(--gold); }
    .ornament::before, .ornament::after { content: ""; display: inline-block; width: 64px; height: 1px; background: var(--line); vertical-align: middle; margin: 0 14px; }
    .card-soft { background: var(--card); border: 1px solid var(--line); border-radius: 1.25rem; }
    .event-title { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-size: 1.45rem; }
    .event-date { font-weight: 400; letter-spacing: .06em; }
    .rules-pill { border: 1px solid var(--line); background: var(--card); border-radius: 9999px; font-size: .8rem; letter-spacing: .04em; }
    .lang-btn { border: 1px solid var(--line); border-radius: 9999px; padding: .2rem .7rem; font-size: .75rem; letter-spacing: .12em; }
    .lang-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    /* while the real site texts load, show nothing instead of demo placeholders */
    #couple, .event-title, .event-place { transition: opacity .4s ease; }
    body.site-pending #couple, body.site-pending .event-title, body.site-pending .event-place { opacity: 0; }
    ul.days { list-style: none; padding: 0; }
    ul.days li { padding-left: 1.1rem; position: relative; }
    ul.days li::before { content: "·"; color: var(--gold); position: absolute; left: 0; font-weight: 700; }

    /* timeline & polaroids */
    .tl { position: relative; padding-left: 2.2rem; }
    .tl::before { content: ""; position: absolute; left: 12px; top: 8px; bottom: 8px; width: 1px; background: var(--line); }
    .tl-item { position: relative; margin-bottom: 2.4rem; }
    .tl-dot { position: absolute; left: -2.2rem; top: 6px; width: 26px; height: 26px; margin-left: 0; background: var(--paper); }
    .polaroid { background: #fff; border: 1px solid #ece7dd; padding: 12px 12px 8px; box-shadow: 0 10px 24px rgba(60,50,30,.12); max-width: 330px; }
    .polaroid img, .polaroid svg { display: block; width: 100%; height: auto; max-height: 260px; object-fit: cover; background: #f4f1ea; }
    .polaroid .caption { font-family: 'Caveat', cursive; font-size: 1.35rem; color: #4a443a; text-align: center; padding: 8px 4px 6px; }
    .tilt-l { transform: rotate(-1.6deg); }
    .tilt-r { transform: rotate(1.8deg); margin-left: auto; }
    @media (min-width: 640px) { .tilt-r { margin-left: 3rem; } .tilt-l { margin-left: .5rem; } }

    /* restyle the wizard (classes generated by app.js) */
    #rsvp .bg-stone-800 { background: var(--ink) !important; letter-spacing: .05em; }
    #rsvp .border-stone-300 { border-color: var(--line) !important; }
    #rsvp .bg-stone-100 { background: var(--paper) !important; }
    #rsvp .bg-amber-50 { background: #f5ecd9 !important; border-color: #e3d2ac !important; }
    #rsvp input, #rsvp textarea { background: var(--card); font-weight: 300; }
    #rsvp .btn-choice.selected { border-color: var(--ink); background: var(--ink); color: var(--paper); }
    #rsvp h3 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-size: 1.4rem; }
  </style>
</head>
<body class="min-h-screen">
  <!-- botanical ornaments: olive branch, acacia (mimosa) pompons, small blossom -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="olive-branch" viewBox="0 0 160 60" fill="none">
      <path d="M10 42 Q80 18 150 30" stroke="#8a8f6a" stroke-width="1.6" fill="none"/>
      <g fill="#9aa078">
        <ellipse cx="34" cy="30" rx="11" ry="3.6" transform="rotate(-28 34 30)"/>
        <ellipse cx="52" cy="34" rx="11" ry="3.6" transform="rotate(18 52 34)"/>
        <ellipse cx="70" cy="24" rx="11" ry="3.6" transform="rotate(-24 70 24)"/>
        <ellipse cx="90" cy="30" rx="11" ry="3.6" transform="rotate(16 90 30)"/>
        <ellipse cx="108" cy="22" rx="11" ry="3.6" transform="rotate(-20 108 22)"/>
        <ellipse cx="128" cy="30" rx="11" ry="3.6" transform="rotate(14 128 30)"/>
      </g>
      <g fill="#5c6b48">
        <circle cx="60" cy="27" r="4"/>
        <circle cx="100" cy="27" r="4"/>
        <circle cx="140" cy="26" r="3.4"/>
      </g>
    </symbol>
    <symbol id="acacia" viewBox="0 0 160 60" fill="none">
      <path d="M20 46 Q80 20 140 34" stroke="#8a8f6a" stroke-width="1.4" fill="none"/>
      <g fill="#e3bd4f">
        <circle cx="46" cy="30" r="5"/><circle cx="56" cy="24" r="4"/><circle cx="54" cy="34" r="3.4"/>
        <circle cx="86" cy="24" r="5"/><circle cx="96" cy="30" r="4"/><circle cx="90" cy="33" r="3"/>
        <circle cx="118" cy="27" r="5"/><circle cx="127" cy="33" r="3.6"/><circle cx="112" cy="34" r="3"/>
      </g>
      <g fill="#9aa078">
        <ellipse cx="34" cy="38" rx="9" ry="2.8" transform="rotate(-20 34 38)"/>
        <ellipse cx="72" cy="32" rx="9" ry="2.8" transform="rotate(12 72 32)"/>
        <ellipse cx="104" cy="38" rx="9" ry="2.8" transform="rotate(-10 104 38)"/>
      </g>
    </symbol>
    <symbol id="blossom" viewBox="0 0 26 26">
      <g fill="currentColor">
        <ellipse cx="13" cy="6" rx="3" ry="4.6"/>
        <ellipse cx="13" cy="20" rx="3" ry="4.6"/>
        <ellipse cx="6" cy="13" rx="4.6" ry="3"/>
        <ellipse cx="20" cy="13" rx="4.6" ry="3"/>
      </g>
      <circle cx="13" cy="13" r="3" fill="#5c6b48"/>
    </symbol>
  </svg>
  <div class="max-w-xl mx-auto px-5 py-8">

    <!-- language toggle -->
    <div class="flex justify-end gap-2 mb-6">
      <button id="lang-fr" class="lang-btn">FR</button>
      <button id="lang-en" class="lang-btn">EN</button>
    </div>

    <!-- hero -->
    <header class="text-center mb-10">
      <p id="t-title" class="overline-sm mb-5"></p>
      <h1 id="couple" class="hero-names text-5xl sm:text-6xl mb-5"></h1>
      <p class="ornament"><svg width="150" height="52" style="vertical-align:middle"><use href="#olive-branch"/></svg></p>
      <p id="t-intro" class="mt-5 text-[1.05rem] text-stone-600 max-w-md mx-auto"></p>
    </header>

    <!-- RSVP area (filled by app.js) -->
    <section id="rsvp" class="card-soft p-6 sm:p-8 mb-10"></section>

    <!-- program -->
    <section class="mb-8">
      <h2 id="t-programTitle" class="serif text-center text-2xl font-semibold mb-5"></h2>
      <div class="grid sm:grid-cols-2 gap-4">
        <div class="card-soft p-6">
          <p class="overline-sm mb-2" style="color: var(--bretagne)"><span id="t-bretagneTitle"></span></p>
          <p class="event-title"><span id="ev-bretagne-date" class="event-date"></span></p>
          <p class="text-sm mt-1 event-place" style="color: var(--muted)"><span id="ev-bretagne-place"></span></p>
          <p id="t-bretagneDesc" class="text-sm mt-3"></p>
        </div>
        <div class="card-soft p-6">
          <p class="overline-sm mb-2" style="color: var(--tunis)"><span id="t-tunisTitle"></span></p>
          <p class="event-title"><span id="ev-tunis-date" class="event-date"></span></p>
          <p class="text-sm mt-1 event-place" style="color: var(--muted)"><span id="ev-tunis-place"></span></p>
          <p id="t-tunisDesc" class="text-sm mt-3"></p>
          <ul id="t-tunisDays" class="days text-sm mt-3 space-y-1" style="color: var(--muted)"></ul>
        </div>
      </div>
      <p class="text-center mt-6"><span id="t-rules" class="rules-pill inline-block py-2 px-5"></span></p>
    </section>

    <!-- timeline "our story" (filled by app.js; hidden when empty) -->
    <section id="timeline" class="hidden my-10"></section>

    <footer class="text-center text-xs mt-10" style="color: var(--muted)">
      <a href="https://github.com/LorenzoLabs/wedding-planner" class="underline">wedding-planner</a>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
