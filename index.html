<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RSVP</title>
  <meta name="robots" content="noindex,nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --paper: #f7f3ec;
      --card: #fffdf9;
      --ink: #2b2620;
      --muted: #8a8070;
      --line: #e6ddcc;
      --gold: #a58a5c;
      --bretagne: #29528a;
      --tunis: #b4551d;
    }
    body { font-family: 'Jost', ui-sans-serif, sans-serif; background: var(--paper); color: var(--ink); font-weight: 300; }
    .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
    .overline-sm { letter-spacing: .35em; text-transform: uppercase; font-size: .68rem; color: var(--gold); font-weight: 500; }
    .hero-names { font-family: 'Cormorant Garamond', Georgia, serif; font-style: italic; font-weight: 600; line-height: 1.05; }
    .ornament { color: var(--gold); }
    .ornament::before, .ornament::after { content: ""; display: inline-block; width: 64px; height: 1px; background: var(--line); vertical-align: middle; margin: 0 14px; }
    .card-soft { background: var(--card); border: 1px solid var(--line); border-radius: 1.25rem; }
    .event-title { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-size: 1.45rem; }
    .event-date { font-weight: 400; letter-spacing: .06em; }
    .rules-pill { border: 1px solid var(--line); background: var(--card); border-radius: 9999px; font-size: .8rem; letter-spacing: .04em; }
    .lang-btn { border: 1px solid var(--line); border-radius: 9999px; padding: .2rem .7rem; font-size: .75rem; letter-spacing: .12em; }
    .lang-btn.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    ul.days { list-style: none; padding: 0; }
    ul.days li { padding-left: 1.1rem; position: relative; }
    ul.days li::before { content: "·"; color: var(--gold); position: absolute; left: 0; font-weight: 700; }

    /* restyle the wizard (classes generated by app.js) */
    #rsvp .bg-stone-800 { background: var(--ink) !important; letter-spacing: .05em; }
    #rsvp .border-stone-300 { border-color: var(--line) !important; }
    #rsvp .bg-stone-100 { background: var(--paper) !important; }
    #rsvp .bg-amber-50 { background: #f5ecd9 !important; border-color: #e3d2ac !important; }
    #rsvp input, #rsvp textarea { background: var(--card); font-weight: 300; }
    #rsvp .btn-choice.selected { border-color: var(--ink); background: var(--ink); color: var(--paper); }
    #rsvp h3 { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 700; font-size: 1.4rem; }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-xl mx-auto px-5 py-8">

    <!-- language toggle -->
    <div class="flex justify-end gap-2 mb-6">
      <button id="lang-fr" class="lang-btn">FR</button>
      <button id="lang-en" class="lang-btn">EN</button>
    </div>

    <!-- hero -->
    <header class="text-center mb-10">
      <p id="t-title" class="overline-sm mb-5"></p>
      <h1 id="couple" class="hero-names text-5xl sm:text-6xl mb-5"></h1>
      <p class="ornament text-lg">❦</p>
      <p id="t-intro" class="mt-5 text-[1.05rem] text-stone-600 max-w-md mx-auto"></p>
    </header>

    <!-- program -->
    <section class="mb-8">
      <h2 id="t-programTitle" class="serif text-center text-2xl font-semibold mb-5"></h2>
      <div class="grid sm:grid-cols-2 gap-4">
        <div class="card-soft p-6">
          <p class="overline-sm mb-2" style="color: var(--bretagne)"><span id="t-bretagneTitle"></span></p>
          <p class="event-title"><span id="ev-bretagne-date" class="event-date"></span></p>
          <p class="text-sm mt-1" style="color: var(--muted)"><span id="ev-bretagne-place"></span></p>
          <p id="t-bretagneDesc" class="text-sm mt-3"></p>
        </div>
        <div class="card-soft p-6">
          <p class="overline-sm mb-2" style="color: var(--tunis)"><span id="t-tunisTitle"></span></p>
          <p class="event-title"><span id="ev-tunis-date" class="event-date"></span></p>
          <p class="text-sm mt-1" style="color: var(--muted)"><span id="ev-tunis-place"></span></p>
          <p id="t-tunisDesc" class="text-sm mt-3"></p>
          <ul id="t-tunisDays" class="days text-sm mt-3 space-y-1" style="color: var(--muted)"></ul>
        </div>
      </div>
      <p class="text-center mt-6"><span id="t-rules" class="rules-pill inline-block py-2 px-5"></span></p>
    </section>

    <!-- RSVP area (filled by app.js) -->
    <section id="rsvp" class="card-soft p-6 sm:p-8"></section>

    <footer class="text-center text-xs mt-10" style="color: var(--muted)">
      <a href="https://github.com/LorenzoLabs/wedding-planner" class="underline">wedding-planner</a>
    </footer>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
