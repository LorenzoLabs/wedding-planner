<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gérer la timeline</title>
  <meta name="robots" content="noindex,nofollow">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Jost', sans-serif; background: #f7f3ec; color: #2b2620; font-weight: 300; }
    .serif { font-family: 'Cormorant Garamond', Georgia, serif; }
    .drop { border: 2px dashed #e0d6c2; }
    .drop.over { border-color: #a58a5c; background: #fffdf9; }
    input, textarea, select { background: #fffdf9; }
    .thumb { width: 76px; height: 76px; object-fit: cover; border-radius: .5rem; }
  </style>
</head>
<body class="min-h-screen">
  <div class="max-w-2xl mx-auto px-5 py-8">
    <h1 class="serif text-3xl font-bold mb-1">Notre histoire — gérer la timeline</h1>
    <p class="text-sm text-stone-500 mb-6">Les moments se rangent automatiquement par date. Jusqu'à 3 photos/vidéos par moment.</p>

    <section class="bg-white rounded-2xl border border-stone-200 p-5 mb-8">
      <!-- media picker -->
      <div id="drop" class="drop rounded-xl p-5 text-center cursor-pointer mb-3">
        <p class="text-2xl mb-1">🖼️🎬</p>
        <p class="text-sm">Glissez jusqu'à 3 photos ou vidéos, ou cliquez</p>
        <p class="text-xs text-stone-400 mt-1">Vidéos : gardez-les courtes (max ~35 Mo) — ou collez un lien ci-dessous</p>
        <input id="file" type="file" accept="image/*,video/*" multiple class="hidden">
      </div>
      <div class="flex gap-2 mb-3">
        <input id="link" placeholder="Coller un lien YouTube ou Google Drive (vidéo)…" class="flex-1 border border-stone-300 rounded-lg p-2 text-sm">
        <button id="addlink" class="px-3 py-2 rounded-lg border border-stone-300 text-sm">Ajouter le lien</button>
      </div>
      <div id="media" class="flex flex-wrap gap-2 mb-4"></div>

      <div class="grid sm:grid-cols-2 gap-3">
        <div><label class="block text-xs mb-1 text-stone-500">Date</label>
          <input id="f-date" type="date" class="w-full border border-stone-300 rounded-lg p-2"></div>
        <div><label class="block text-xs mb-1 text-stone-500">Étiquette affichée (optionnel)</label>
          <input id="f-label" placeholder="ex. Été 2023" class="w-full border border-stone-300 rounded-lg p-2"></div>
        <div><label class="block text-xs mb-1 text-stone-500">Description (français)</label>
          <input id="f-fr" placeholder="Notre rencontre à Berlin" class="w-full border border-stone-300 rounded-lg p-2"></div>
        <div><label class="block text-xs mb-1 text-stone-500">Description (anglais, optionnel)</label>
          <input id="f-en" placeholder="We met in Berlin" class="w-full border border-stone-300 rounded-lg p-2"></div>
      </div>
      <div class="flex items-center gap-3 mt-4">
        <button id="add" class="px-5 py-2 rounded-lg bg-stone-800 text-white">Ajouter le moment</button>
        <span id="status" class="text-sm text-stone-500"></span>
      </div>
    </section>

    <h2 class="serif text-xl font-semibold mb-3">Moments (<span id="count">…</span>)</h2>
    <div id="list" class="space-y-3">Chargement…</div>
  </div>

  <script src="config.js"></script>
  <script>
  (function () {
    const key = new URLSearchParams(location.search).get("key");
    const $ = id => document.getElementById(id);
    const status = m => { $("status").textContent = m || ""; };
    let media = []; // up to 3: {dataB64, mimeType, filename, preview} | {link, video, preview}

    if (!CONFIG.gasUrl) { $("list").textContent = "Configurez d'abord l'API (config.js)."; return; }
    if (!key) { $("list").innerHTML = "<p class='text-red-600'>Ajoutez ?key=VOTRE_CLE à l'URL (onglet Config de la Sheet).</p>"; return; }

    const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    async function api(payload) {
      const res = await fetch(CONFIG.gasUrl, { method: "POST", body: JSON.stringify(Object.assign({ key }, payload)) });
      return res.json();
    }

    // date input (YYYY-MM-DD) -> nice labels, auto-filled unless the user typed a custom label
    function labels(iso) {
      if (!iso) return { fr: "", en: "" };
      const d = new Date(iso + "T12:00:00");
      const fr = d.toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" });
      const en = d.toLocaleDateString("en-GB", { day: "numeric", month: "long", year: "numeric" });
      return { fr, en };
    }

    function shrinkImage(file, cb) {
      const rd = new FileReader();
      rd.onload = e => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          const s = Math.min(1, 1600 / Math.max(w, h));
          w = Math.round(w * s); h = Math.round(h * s);
          const c = document.createElement("canvas"); c.width = w; c.height = h;
          c.getContext("2d").drawImage(img, 0, 0, w, h);
          const url = c.toDataURL("image/jpeg", 0.85);
          cb({ dataB64: url.split(",")[1], mimeType: "image/jpeg", filename: (file.name || "photo").replace(/\.[^.]+$/, "") + ".jpg", preview: url, kind: "image" });
        };
        img.src = e.target.result;
      };
      rd.readAsDataURL(file);
    }

    function addFile(file) {
      if (media.length >= 3) { status("3 médias maximum par moment."); return; }
      if (file.type.indexOf("image") === 0) {
        shrinkImage(file, m => { media.push(m); renderMedia(); });
      } else if (file.type.indexOf("video") === 0) {
        if (file.size > 35 * 1024 * 1024) { status("Vidéo trop lourde (" + Math.round(file.size / 1e6) + " Mo). Max ~35 Mo, ou collez un lien YouTube/Drive."); return; }
        const rd = new FileReader();
        rd.onload = e => { media.push({ dataB64: e.target.result.split(",")[1], mimeType: file.type, filename: file.name || "clip.mp4", preview: "", kind: "video" }); renderMedia(); };
        rd.readAsDataURL(file);
      }
    }

    function renderMedia() {
      $("media").innerHTML = media.map((m, i) => `
        <div class="relative">
          ${m.kind === "image" && m.preview ? `<img src="${esc(m.preview)}" class="thumb">`
            : `<div class="thumb bg-stone-800 text-white flex items-center justify-center text-2xl">🎬</div>`}
          <button data-rm="${i}" class="absolute -top-2 -right-2 bg-white border border-stone-300 rounded-full w-5 h-5 text-xs leading-none">✕</button>
        </div>`).join("");
      $("media").querySelectorAll("[data-rm]").forEach(b => b.onclick = () => { media.splice(+b.dataset.rm, 1); renderMedia(); });
    }

    $("drop").onclick = () => $("file").click();
    $("file").onchange = e => { [...e.target.files].slice(0, 3).forEach(addFile); e.target.value = ""; };
    ["dragover", "dragenter"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.add("over"); }));
    ["dragleave", "drop"].forEach(ev => $("drop").addEventListener(ev, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
    $("drop").addEventListener("drop", e => [...e.dataTransfer.files].slice(0, 3).forEach(addFile));

    $("addlink").onclick = () => {
      const url = $("link").value.trim();
      if (!url) return;
      if (media.length >= 3) { status("3 médias maximum."); return; }
      const isVideo = /youtu\.be|youtube\.com|\.mp4|\.mov|\.webm/i.test(url);
      media.push({ link: url, video: isVideo, kind: "video", preview: "" });
      $("link").value = ""; renderMedia();
    };

    $("f-date").onchange = () => {
      if (!$("f-label").value.trim()) { /* label stays auto */ }
    };

    $("add").onclick = async () => {
      const iso = $("f-date").value;
      const custom = $("f-label").value.trim();
      const lab = labels(iso);
      const dateFr = custom || lab.fr, dateEn = custom || lab.en;
      const fr = $("f-fr").value.trim(), en = $("f-en").value.trim();
      if (!dateFr && !fr && !media.length) { status("Ajoutez au moins une date, une description ou un média."); return; }
      $("add").disabled = true; status(media.some(m => m.dataB64) ? "Envoi des médias…" : "Ajout…");
      try {
        const payload = { action: "add_timeline", sort: iso || "", dateFr, dateEn, descFr: fr, descEn: en,
          media: media.map(m => m.link ? { link: m.link, video: m.video } : { dataB64: m.dataB64, mimeType: m.mimeType, filename: m.filename }) };
        const r = await api(payload);
        if (!r.ok) { status("Erreur : " + (r.error || "inconnue")); $("add").disabled = false; return; }
        $("f-date").value = ""; $("f-label").value = ""; $("f-fr").value = ""; $("f-en").value = "";
        media = []; renderMedia(); status("Ajouté ✓"); render(r.items);
      } catch (e) { status("Erreur réseau, réessayez."); }
      $("add").disabled = false;
    };

    async function del(row) { status("…"); const r = await api({ action: "delete_timeline", row }); if (r.ok) { render(r.items); status(""); } else status("Erreur"); }

    function render(items) {
      $("count").textContent = items.length;
      if (!items.length) { $("list").innerHTML = "<p class='text-stone-400'>Aucun moment pour l'instant.</p>"; return; }
      $("list").innerHTML = items.map(it => {
        const first = it.media && it.media[0];
        const thumb = first
          ? (first.type === "video"
              ? `<div class="thumb bg-stone-800 text-white flex items-center justify-center text-xl flex-shrink-0">${first.thumb ? `<img src="${esc(first.thumb)}" class="thumb">` : "🎬"}</div>`
              : `<img src="${esc(first.src)}" class="thumb flex-shrink-0">`)
          : `<div class="thumb bg-stone-100 flex items-center justify-center text-xl flex-shrink-0">🌿</div>`;
        const extra = it.media && it.media.length > 1 ? `<span class="text-xs text-stone-400">+${it.media.length - 1}</span>` : "";
        return `<div class="bg-white rounded-xl border border-stone-200 p-3 flex gap-3 items-center">
          ${thumb}
          <div class="flex-1 min-w-0">
            <p class="font-medium">${esc(it.dateFr) || "<span class='text-stone-400'>(sans date)</span>"} ${extra}</p>
            <p class="text-sm text-stone-600 truncate">${esc(it.descFr)}</p>
            ${it.descEn ? `<p class="text-xs text-stone-400 truncate">${esc(it.descEn)}</p>` : ""}
          </div>
          <button data-del="${it.row}" title="Supprimer" class="text-stone-300 hover:text-red-600 text-lg px-1">✕</button>
        </div>`;
      }).join("");
      $("list").querySelectorAll("[data-del]").forEach(b => b.onclick = () => { if (confirm("Supprimer ce moment ?")) del(+b.dataset.del); });
    }

    (async () => {
      const r = await api({ action: "list_timeline" });
      if (!r.ok) { $("list").innerHTML = "<p class='text-red-600'>Clé invalide ou erreur.</p>"; return; }
      render(r.items);
    })();
  })();
  </script>
</body>
</html>
